<!doctype html>
<html lang="vi">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💧</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="js/app.js" defer></script>

<body data-view="step">
<div class="deco" aria-hidden="true"><i>✦</i><i>♡</i><i>✿</i><i>✦</i><i>☁</i><i>♡</i></div>

    <button id="btnRef" class="tbtn" type="button" title="Tra nhanh 5 oxytocics"><span class="i">📌</span><span class="t">Tra nhanh</span></button>
    <button id="btnSound" class="tbtn" type="button" title="Bật/tắt âm thanh" aria-label="Bật/tắt âm thanh"><span class="i">🔔</span></button>
  </nav>
</header>

<div class="progress" aria-label="Tiến độ">
  <div class="tube"><div class="fill"></div><span class="drop-mark">💧</span></div>
  <span class="ptext"></span>
</div>

<main id="stage"></main>
<section id="map" aria-label="Bản đồ lộ trình"></section>

<aside id="drawer" aria-label="Mục lục">

  <div id="tocList"></div>
</aside>
<div id="scrim" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
